name: 'Azure IaC Reviewer'
description: 'Analyzes Azure Bicep files in pull requests and provides cost insights and best practice recommendations'
author: 'resourcepulse-io'

branding:
  icon: 'activity'
  color: 'purple'

inputs:
  api_key:
    description: 'API key for the Azure IaC Reviewer backend service (optional)'
    required: false
    default: ''
  comment_mode:
    description: 'Comment mode: "update" to update existing comment, "new" to create new comment each time'
    required: false
    default: 'update'
  env:
    description: 'Environment hint for policy selection (e.g., dev, prod)'
    required: false
    default: ''
  param_file:
    description: 'Path to a .bicepparam file in the repo (e.g., infra/params/dev.bicepparam)'
    required: false
    default: ''
  main_region:
    description: 'Fallback Azure region when param_file is not provided (e.g., eastus, westeurope)'
    required: false
    default: ''
  use_dev:
    description: 'Use the development backend for testing (requires admin_key)'
    required: false
    default: 'false'
  admin_key:
    description: 'Admin key for authenticating against the development backend'
    required: false
    default: ''

outputs:
  resources_detected:
    description: 'Number of Azure resources detected in changed Bicep files'
  analysis_status:
    description: 'Status of the analysis: success, partial, or failed'

runs:
  using: 'node20'
  main: 'dist/index.js'
